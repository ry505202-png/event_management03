version: '3.8'

services:
  celebration-planner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celebration-event-planner
    ports:
      - '8080:8080'
    environment:
      - PORT=8080
      - NODE_ENV=production
      - MOCK_AI=true
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - CORS_ORIGIN=http://localhost:8080
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
